<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10172a">
    <title>Кодова арена — оператори JavaScript</title>
<link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <main class="game">
        <p class="eyebrow">Навчальна гра · JavaScript</p>
        <h1>Кодова арена</h1>
        <p class="intro">Перевір, як працюють оператори порівняння та логічні оператори. Обирай відповідь, збирай XP і підтримуй серію правильних відповідей!</p>

        <section class="stats" aria-label="Ігрова статистика">
            <div class="stat">
                <span class="stat-label">Досвід</span>
                <strong id="score">0 XP</strong>
            </div>
            <div class="stat">
                <span class="stat-label">Серія 🔥</span>
                <strong id="streak">0</strong>
            </div>
            <div class="stat">
                <span class="stat-label">Рівень</span>
                <strong id="level">Новачок</strong>
            </div>
        </section>

        <section class="quiz-card" aria-labelledby="question">
            <div class="progress-row">
                <span id="question-count">Запитання 1 з 20</span>
                <span id="progress-percent">0%</span>
            </div>
            <div
                class="progress-track"
                id="progress-track"
                role="progressbar"
                aria-label="Прогрес тесту"
                aria-valuemin="0"
                aria-valuemax="20"
                aria-valuenow="0"
            >
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div id="quiz-content">
                <h2 class="question" id="question"></h2>
                <div class="answers" id="answers"></div>
                <section class="feedback" id="feedback" aria-live="polite" hidden>
                    <h3>Пояснення</h3>
                    <p id="feedback-explanation"></p>
                    <h3>Приклад коду</h3>
                    <pre><code id="feedback-code"></code></pre>
                    <h3>Практичне застосування</h3>
                    <p id="feedback-application"></p>
                </section>
                <div class="actions">
                    <button class="action-button" id="next-button" type="button" hidden>Далі</button>
                </div>
            </div>
            <div class="result" id="result" aria-live="polite" hidden>
                <p class="eyebrow">Раунд завершено</p>
                <h2 id="result-title"></h2>
                <p id="result-summary"></p>
                <button class="action-button" id="restart-button" type="button">Зіграти ще раз</button>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
